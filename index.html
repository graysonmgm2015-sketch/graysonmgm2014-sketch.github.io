<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HoloDex Elite</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="header">
        <div class="logo">HOLO<span>DEX</span></div>
        <select id="lang" class="lang-pill" onchange="app.translate()">
            <option value="en">English</option>
            <option value="es">Español</option>
        </select>
    </header>

    <section id="scr-home" class="screen active">
        <div class="glass-card">
            <p class="label">Total Portfolio Value</p>
            <h1 id="total-val">$0.00</h1>
            <canvas id="mainChart"></canvas>
            <div class="timeline-tabs">
                <span>7D</span><span>1M</span><span class="active">MAX</span>
            </div>
        </div>
        <h3 class="section-title">My Collection</h3>
        <div id="portfolioGrid" class="grid"></div>
    </section>

    <section id="scr-market" class="screen">
        <h2 class="section-title">Live Market</h2>
        <div id="marketGrid" class="grid"></div>
    </section>

    <section id="scr-ai" class="screen">
        <h2 class="section-title">AI Visual Grade</h2>
        <div class="viewfinder-container" id="v-frame">
            <video id="video" autoplay playsinline></video>
            <div class="scanner-line"></div>
            <div class="target-corners"></div>
        </div>
        
        <div id="ai-res" class="glass-card result-panel">
            <div class="result-row">
                <span>Centering: <b id="r-c">--</b></span>
                <span>Edges: <b id="r-e">--</b></span>
            </div>
            <h1 id="r-t">--</h1>
        </div>

        <button class="action-btn" onclick="app.startScan()">
            <span class="material-symbols-outlined">center_focus_strong</span>
            RUN AI ANALYSIS
        </button>
    </section>

    <section id="scr-map" class="screen">
        <h2 class="section-title">Store Finder</h2>
        <div class="map-area">
            <div class="pin" style="top:35%; left:45%;" onclick="app.showStore('Poke Stop', '9:00 - 21:00')"></div>
            <div class="pin" style="top:65%; left:25%;" onclick="app.showStore('Elite Cards', '11:00 - 19:00')"></div>
        </div>
        <div id="store-ui" class="glass-card store-popup">
            <h3 id="st-n"></h3>
            <p id="st-s"></p>
            <button class="action-btn sm">Get Directions</button>
        </div>
    </section>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="app.tab('home', this)">
            <span class="material-symbols-outlined">analytics</span>
            <span>Vault</span>
        </div>
        <div class="nav-item" onclick="app.tab('market', this)">
            <span class="material-symbols-outlined">explore</span>
            <span>Market</span>
        </div>
        <div class="nav-item" onclick="app.tab('ai', this)">
            <span class="material-symbols-outlined">document_scanner</span>
            <span>Grade</span>
        </div>
        <div class="nav-item" onclick="app.tab('map', this)">
            <span class="material-symbols-outlined">location_on</span>
            <span>Map</span>
        </div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
